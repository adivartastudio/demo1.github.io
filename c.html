<meta name="viewport" content="width=375, user-scalable=no" />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="c.css" />

<div class="c-container">
  <!-- Background Video -->
  <video class="bg-video" src="pengantin.mp4" autoplay muted loop playsinline></video>

  <!-- Konten -->
  <div class="konten">
    <!-- Pengantin Pria -->
    <div class="profil fade">
      <img src="cowok.png" alt="Foto Pengantin Pria" class="foto" />
      <p class="nama">Kadek Hendrawan</p>
      <p class="deskripsi">
        Putra kedua dari pasangan<br />
        I Ketut Sumajaya<br />
        &<br />
        Wayan Kerti Sutiari<br />
        Kediri, Tabanan
      </p>
    </div>

    <!-- Pengantin Wanita -->
    <div class="profil fade">
      <img src="cewek.png" alt="Foto Pengantin Wanita" class="foto" />
      <p class="nama">Kadek Olivia Putri</p>
      <p class="deskripsi">
        Putri kedua dari pasangan<br />
        I Nengah Sumajaya<br />
        &<br />
        Kadek Sumartini<br />
        Abang, Karangasem
      </p>
    </div>
  </div>
</div>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("active");
      }
    });
  }, { threshold: 0.2 });

  document.querySelectorAll('.fade').forEach(el => {
    observer.observe(el);
  });
</script>
