<meta name="viewport" content="width=375, user-scalable=no" />
<link rel="stylesheet" href="a.css" />

<div class="container">
  <div>
    <div class="ornament">❀ ❁ ❀</div>

    <p class="salutation">Kpd Bpk/Ibu/Saudara/i</p>
    <p class="nama" id="namaTamu">Tamu Undangan</p>
    <p class="note">Mohon maaf apabila ada kesalahan penulisan nama/gelar</p>

    <button id="openBtn">Buka Undangan</button>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const nama = urlParams.get('nama');
  if (nama) {
    document.getElementById("namaTamu").textContent = decodeURIComponent(nama);
  }

  document.getElementById("openBtn").addEventListener('click', () => {
    alert('Selamat datang di undangan!');
    // window.location.href = 'undangan.html'; // Contoh navigasi
  });
</script>
